<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="cart.js"></script>
<script src="products.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  let activeCategory = params.get("category") || "";
  let activeSort = params.get("sort") || "new";

  const filterBar = document.getElementById("filterBar");
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.dataset.cat = cat.id;
    btn.dataset.bn = `${cat.icon} ${cat.bn}`;
    btn.dataset.en = `${cat.icon} ${cat.label}`;
    btn.textContent = currentLang() === "en" ? btn.dataset.en : btn.dataset.bn;
    filterBar.insertBefore(btn, document.querySelector(".filter-right"));
  });

  const sortSelect = document.getElementById("sortSelect");
  sortSelect.value = activeSort;

  // SEO: keep <title> and meta description in sync with the active category filter
  function updateShopSeo() {
    const lang = currentLang();
    if (activeCategory) {
      const cat = categoryById(activeCategory);
      const catLabel = lang === "en" ? cat.label : cat.bn;
      const title = lang === "en"
        ? `${catLabel} — StrDust | Buy Online in Bangladesh`
        : `${catLabel} কিনুন — StrDust | অনলাইন শপ বাংলাদেশ`;
      const desc = lang === "en"
        ? `Shop ${catLabel} at StrDust — original quality, fast delivery inside Dhaka, cash on delivery available.`
        : `StrDust থেকে ${catLabel} কিনুন — অরিজিনাল কোয়ালিটি, ঢাকায় ১-৩ দিনে ডেলিভারি, ক্যাশ অন ডেলিভারি সুবিধাসহ।`;
      document.title = title;
      document.querySelector('meta[name="description"]').setAttribute("content", desc);
    } else {
      document.title = "সব প্রোডাক্ট — StrDust | টি-শার্ট, পারফিউম, গ্যাজেট, জুয়েলারি";
      document.querySelector('meta[name="description"]').setAttribute("content",
        "StrDust-এ টি-শার্ট, গ্যাজেট, অরিজিনাল পারফিউম, প্যান্ট, ঘড়ি আর জুয়েলারি — ক্যাটাগরি অনুযায়ী ফিল্টার করে দেখুন। ঢাকায় ১-৩ দিনে ডেলিভারি, ক্যাশ অন ডেলিভারি সুবিধাসহ।");
    }
  }

  function setActiveChip() {
    const lang = currentLang();
    document.querySelectorAll(".chip").forEach(chip => {
      chip.classList.toggle("active", chip.dataset.cat === activeCategory);
    });
    const title = activeCategory
      ? (lang === "en" ? categoryById(activeCategory).label : categoryById(activeCategory).bn)
      : (lang === "en" ? "All Products" : "সব প্রোডাক্ট");
    document.getElementById("pageTitle").textContent = title;
    document.getElementById("pageEyebrow").textContent = activeCategory
      ? (lang === "en" ? "Category" : "ক্যাটাগরি")
      : (lang === "en" ? "All Products" : "সব প্রোডাক্ট");
    updateShopSeo();
  }

  async function loadShop() {
    const grid = document.getElementById("shopGrid");
    renderSkeletons(grid, 8);
    const emptyMsg = currentLang() === "en"
      ? "No products in this category yet — add some from the admin panel."
      : "এই ক্যাটাগরিতে এখনো প্রোডাক্ট যোগ হয়নি — অ্যাডমিন প্যানেল থেকে যোগ করুন।";
    try {
      const items = await fetchProducts({ category: activeCategory || null, sort: activeSort, max: 100 });
      renderGrid(grid, items, emptyMsg);
    } catch (e) {
      renderGrid(grid, []);
    }
  }

  filterBar.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    activeCategory = chip.dataset.cat;
    const url = new URL(location);
    if (activeCategory) url.searchParams.set("category", activeCategory); else url.searchParams.delete("category");
    history.pushState({}, "", url);
    setActiveChip();
    loadShop();
  });

  sortSelect.addEventListener("change", () => {
    activeSort = sortSelect.value;
    loadShop();
  });

  document.addEventListener("languagechange", () => {
    document.querySelectorAll(".chip[data-cat]").forEach(chip => {
      if (chip.dataset.bn) chip.textContent = currentLang() === "en" ? chip.dataset.en : chip.dataset.bn;
    });
    setActiveChip();
    loadShop();
  });

  setActiveChip();
  loadShop();
</script>
</body>
</html>
