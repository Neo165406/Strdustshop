<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সব প্রোডাক্ট — StrDust</title>
<meta name="description" content="StrDust-এ টি-শার্ট, গ্যাজেট, পারফিউম, প্যান্ট, ঘড়ি আর জুয়েলারি — ক্যাটাগরি অনুযায়ী ফিল্টার করে দেখুন।">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Str<span class="dot">•</span>Dust</a>
    <nav class="main-nav">
      <a href="index.html">হোম</a>
      <a href="shop.html" class="active">সব প্রোডাক্ট</a>
      <a href="shop.html?category=tshirt">টি-শার্ট</a>
      <a href="shop.html?category=gadget">গ্যাজেট</a>
      <a href="shop.html?category=jewelry">জুয়েলারি</a>
      <a href="track-order.html">অর্ডার ট্র্যাক</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="icon-btn" aria-label="কার্ট">
        🛒
        <span class="cart-badge" data-cart-count style="display:none;">0</span>
      </a>
      <button class="nav-toggle" aria-label="মেনু">☰</button>
    </div>
  </div>
</header>

<div class="container" style="padding-top:32px;">
  <span class="eyebrow" id="pageEyebrow">সব প্রোডাক্ট</span>
  <h1 style="margin:6px 0 24px;font-size:clamp(24px,3.4vw,32px);" id="pageTitle">সব প্রোডাক্ট</h1>

  <div class="filter-bar" id="filterBar">
    <button class="chip" data-cat="">সব</button>
    <!-- category chips injected by JS -->
    <div class="filter-right">
      <select class="select" id="sortSelect">
        <option value="new">নতুন আগে</option>
        <option value="price-low">দাম: কম থেকে বেশি</option>
        <option value="price-high">দাম: বেশি থেকে কম</option>
      </select>
    </div>
  </div>

  <div class="product-grid" id="shopGrid" style="margin-bottom:64px;"></div>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding-top:0;">
      <span>© 2026 StrDust. সর্বস্বত্ব সংরক্ষিত।</span>
      <span>Cash on Delivery সারা বাংলাদেশে</span>
    </div>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="cart.js"></script>
<script src="products.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  let activeCategory = params.get("category") || "";
  let activeSort = params.get("sort") || "new";

  const filterBar = document.getElementById("filterBar");
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.dataset.cat = cat.id;
    btn.textContent = `${cat.icon} ${cat.bn}`;
    filterBar.insertBefore(btn, document.querySelector(".filter-right"));
  });

  const sortSelect = document.getElementById("sortSelect");
  sortSelect.value = activeSort;

  function setActiveChip() {
    document.querySelectorAll(".chip").forEach(chip => {
      chip.classList.toggle("active", chip.dataset.cat === activeCategory);
    });
    const title = activeCategory ? categoryById(activeCategory).bn : "সব প্রোডাক্ট";
    document.getElementById("pageTitle").textContent = title;
    document.getElementById("pageEyebrow").textContent = activeCategory ? "ক্যাটাগরি" : "সব প্রোডাক্ট";
  }

  async function loadShop() {
    const grid = document.getElementById("shopGrid");
    renderSkeletons(grid, 8);
    try {
      const items = await fetchProducts({ category: activeCategory || null, sort: activeSort, max: 100 });
      renderGrid(grid, items, "এই ক্যাটাগরিতে এখনো প্রোডাক্ট যোগ হয়নি — অ্যাডমিন প্যানেল থেকে যোগ করুন।");
    } catch (e) {
      renderGrid(grid, []);
    }
  }

  filterBar.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    activeCategory = chip.dataset.cat;
    const url = new URL(location);
    if (activeCategory) url.searchParams.set("category", activeCategory); else url.searchParams.delete("category");
    history.pushState({}, "", url);
    setActiveChip();
    loadShop();
  });

  sortSelect.addEventListener("change", () => {
    activeSort = sortSelect.value;
    loadShop();
  });

  setActiveChip();
  loadShop();
</script>
<script>
(function(){
  var toggle = document.querySelector(".nav-toggle");
  var nav = document.querySelector(".main-nav");
  if (!toggle || !nav) return;
  toggle.addEventListener("click", function(e){
    e.stopPropagation();
    nav.classList.toggle("open");
    document.body.style.overflow = nav.classList.contains("open") ? "hidden" : "";
  });
  nav.querySelectorAll("a").forEach(function(a){
    a.addEventListener("click", function(){
      nav.classList.remove("open");
      document.body.style.overflow = "";
    });
  });
  document.addEventListener("click", function(e){
    if (nav.classList.contains("open") && !nav.contains(e.target) && !toggle.contains(e.target)) {
      nav.classList.remove("open");
      document.body.style.overflow = "";
    }
  });
})();
</script>
</body>
</html>
