<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#090a0c">
<title>Homepage Hero Settings — StrDust</title>
<link rel="stylesheet" href="style.css">
<style>
  body{min-height:100vh;background:#090a0c;color:#f2f0eb;padding:24px}
  .editor{max-width:820px;margin:30px auto;background:#151619;border:1px solid #303136;border-radius:20px;padding:clamp(20px,4vw,38px);box-shadow:0 24px 70px #0008}
  .editor h1{font-size:clamp(26px,4vw,38px);margin-bottom:8px}
  .muted{color:#a5a5a7;margin-bottom:28px}
  .field{display:grid;gap:8px;margin:18px 0}
  .field label{font-size:13px;font-weight:700;color:#dedbd4}
  .field input,.field textarea{width:100%;border:1px solid #414247;background:#0d0e10;color:#f4f2ed;border-radius:10px;padding:13px 14px;font:inherit}
  .field textarea{min-height:92px;resize:vertical}
  .preview{display:none;width:100%;max-height:340px;object-fit:cover;border-radius:12px;border:1px solid #414247;margin-top:12px}
  .preview.show{display:block}
  .upload{border:1px dashed #777;border-radius:14px;padding:18px;background:#101114}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
  .status{min-height:24px;margin-top:16px;color:#d8d5ce;font-size:13px}
  .back{display:inline-block;color:#d8d5ce;margin-bottom:20px}
  .btn-secondary{background:#26272b;color:#f2f0eb;border:1px solid #45464a}
</style>
</head>
<body>
<main class="editor">
  <a class="back" href="dashboard.html"><span class="logo-wordmark"><span class="logo-str">Str</span><span class="logo-dust">Dust</span></span></a><br><a class="back" href="dashboard.html">← Back to dashboard</a>
  <h1>Homepage hero</h1>
  <p class="muted">Upload a wide fashion campaign image and update the homepage headline. Recommended image ratio: 16:7 or 16:9. Maximum file size: 8 MB.</p>
  <form id="heroForm">
    <div class="field">
      <label for="heroImage">Hero image</label>
      <div class="upload"><input id="heroImage" type="file" accept="image/jpeg,image/png,image/webp"></div>
      <img id="heroPreview" class="preview" alt="Hero image preview">
    </div>
    <div class="field"><label for="heroTitle">Headline</label><input id="heroTitle" maxlength="90" value="Wear the Difference" required></div>
    <div class="field"><label for="heroSubtitle">Supporting text</label><textarea id="heroSubtitle" maxlength="220">Stand out with pieces made for your own kind of style.</textarea></div>
    <div class="field"><label for="heroCtaText">Button label</label><input id="heroCtaText" maxlength="30" value="Shop Now"></div>
    <div class="field"><label for="heroCtaLink">Button destination</label><input id="heroCtaLink" maxlength="180" value="shop.html"></div>
    <div class="actions">
      <button class="btn btn-aqua" type="submit" id="saveHero">Save hero settings</button>
      <button class="btn btn-secondary" type="button" id="removeImage">Remove current image</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>
</main>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(() => {
  const form = document.getElementById("heroForm");
  const fileInput = document.getElementById("heroImage");
  const preview = document.getElementById("heroPreview");
  const status = document.getElementById("status");
  const saveButton = document.getElementById("saveHero");
  let heroImageUrl = "";
  let removeCurrentImage = false;

  function say(message) { status.textContent = message; }
  function showPreview(url) {
    if (!url) { preview.removeAttribute("src"); preview.classList.remove("show"); return; }
    preview.src = url;
    preview.classList.add("show");
  }

  auth.onAuthStateChanged(async user => {
    if (!user) { location.replace("login.html"); return; }
    try {
      const snap = await db.collection("siteSettings").doc("homepage").get();
      if (snap.exists) {
        const data = snap.data() || {};
        heroImageUrl = data.heroImageUrl || "";
        document.getElementById("heroTitle").value = data.heroTitle || "Wear the Difference";
        document.getElementById("heroSubtitle").value = data.heroSubtitle || "Stand out with pieces made for your own kind of style.";
        document.getElementById("heroCtaText").value = data.heroCtaText || "Shop Now";
        document.getElementById("heroCtaLink").value = data.heroCtaLink || "shop.html";
        showPreview(heroImageUrl);
      }
    } catch (error) { say("Could not load settings. Check Firestore access and try again."); }
  });

  fileInput.addEventListener("change", () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) {
      fileInput.value = "";
      say("Choose an image smaller than 8 MB.");
      return;
    }
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) {
      fileInput.value = "";
      say("Use a JPG, PNG or WebP image.");
      return;
    }
    removeCurrentImage = false;
    showPreview(URL.createObjectURL(file));
    say("Image selected. Save to upload it and publish the change.");
  });

  document.getElementById("removeImage").addEventListener("click", () => {
    heroImageUrl = "";
    removeCurrentImage = true;
    fileInput.value = "";
    showPreview("");
    say("Current image will be removed when you save.");
  });

  form.addEventListener("submit", async event => {
    event.preventDefault();
    const user = auth.currentUser;
    if (!user) { location.replace("login.html"); return; }
    saveButton.disabled = true;
    say("Saving hero settings…");
    try {
      const file = fileInput.files && fileInput.files[0];
      if (file) {
        if (typeof IMGBB_API_KEY === "undefined" || !IMGBB_API_KEY) throw new Error("Image hosting is not configured.");
        const body = new FormData();
        body.append("image", file);
        const response = await fetch("https://api.imgbb.com/1/upload?key=" + encodeURIComponent(IMGBB_API_KEY), { method:"POST", body });
        const result = await response.json();
        if (!response.ok || !result.success || !result.data || !result.data.url) throw new Error(result.error?.message || "Image upload failed.");
        heroImageUrl = result.data.url;
      } else if (removeCurrentImage) {
        heroImageUrl = "";
      }
      const title = document.getElementById("heroTitle").value.trim();
      const subtitle = document.getElementById("heroSubtitle").value.trim();
      const ctaText = document.getElementById("heroCtaText").value.trim() || "Shop Now";
      const ctaLink = document.getElementById("heroCtaLink").value.trim() || "shop.html";
      if (!title || !subtitle) throw new Error("Headline and supporting text are required.");
      const safeLink = ctaLink.startsWith("https://") || ctaLink.startsWith("http://") || (ctaLink.startsWith("/") && !ctaLink.startsWith("//")) || /^[A-Za-z0-9_-][A-Za-z0-9_./?&=#%-]*$/.test(ctaLink);
      if (!safeLink) throw new Error("Enter a valid button destination.");
      await db.collection("siteSettings").doc("homepage").set({
        heroImageUrl, heroTitle:title, heroSubtitle:subtitle, heroCtaText:ctaText,
        heroCtaLink:ctaLink, updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy:user.uid
      }, { merge:true });
      removeCurrentImage = false;
      fileInput.value = "";
      showPreview(heroImageUrl);
      say("Saved. The homepage will display the updated hero settings.");
    } catch (error) {
      say(error.message || "Could not save settings. Please try again.");
    } finally {
      saveButton.disabled = false;
    }
  });
})();
</script>
</body>
</html>
