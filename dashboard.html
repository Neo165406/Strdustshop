<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অ্যাডমিন ড্যাশবোর্ড — StrDust</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d9488">
<link rel="stylesheet" href="style.css">
<style>
  /* Added for size chart + ML/decant variant fields — safe to move into style.css */
  .size-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .size-chip{
    padding:8px 16px;border-radius:8px;border:1.5px solid var(--border,#ddd);
    background:#fff;font-size:13px;font-weight:600;cursor:pointer;
    transition:all .15s ease;
  }
  .size-chip.active{background:var(--aqua,#0FBFA0);border-color:var(--aqua,#0FBFA0);color:#fff;}
  #mlRows .field-row{display:flex;gap:10px;}
  #mlRows .field-row .field{flex:1;}
</style>
</head>
<body>

<div class="admin-shell hidden" id="adminShell">
  <aside class="admin-side">
    <div class="logo">Str<span class="dot">•</span>Dust</div>
    <a href="#" data-tab="overview" class="tab-link active">📊 ওভারভিউ</a>
    <a href="#" data-tab="products" class="tab-link">🛍️ প্রোডাক্ট</a>
    <a href="#" data-tab="orders" class="tab-link">📦 অর্ডার</a>
    <a href="#" data-tab="slides" class="tab-link">🎠 স্লাইড</a>
    <a href="#" data-tab="theme" class="tab-link">🎨 থিম</a>
    <a href="index.html" target="_blank">🔗 স্টোর দেখুন</a>
    <a href="#" id="logoutBtn">🚪 লগআউট</a>
  </aside>

  <main class="admin-main">

    <!-- OVERVIEW -->
    <section id="tab-overview">
      <div class="admin-topbar"><h1>ওভারভিউ</h1></div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">মোট প্রোডাক্ট</div><div class="stat-value" id="statProducts">—</div></div>
        <div class="stat-card"><div class="stat-label">মোট অর্ডার</div><div class="stat-value" id="statOrders">—</div></div>
        <div class="stat-card"><div class="stat-label">পেন্ডিং অর্ডার</div><div class="stat-value" id="statPending">—</div></div>
      </div>
      <div style="margin-top:24px;">
        <button class="btn btn-aqua" id="seedBtn">🌱 ডেমো প্রোডাক্ট যোগ করুন</button>
      </div>
    </section>

    <!-- PRODUCTS -->
    <section id="tab-products" class="hidden">
      <div class="admin-topbar">
        <h1>প্রোডাক্ট</h1>
        <button class="btn btn-aqua" id="addProductBtn">+ নতুন প্রোডাক্ট</button>
      </div>
      <div id="productList"></div>
    </section>

    <!-- ORDERS -->
    <section id="tab-orders" class="hidden">
      <div class="admin-topbar"><h1>অর্ডার</h1></div>
      <div id="orderList"></div>
    </section>

    <!-- SLIDES -->
    <section id="tab-slides" class="hidden">
      <div class="admin-topbar">
        <h1>স্লাইড</h1>
        <button class="btn btn-aqua" id="addSlideBtn">+ নতুন স্লাইড</button>
      </div>
      <div id="slideList"></div>
    </section>

    <!-- THEME -->
    <section id="tab-theme" class="hidden">
      <div class="admin-topbar"><h1>থিম</h1></div>
      <p>থিম সেটিংস শীঘ্রই আসছে।</p>
    </section>

  </main>
</div>

<!-- Product modal / form would be here in full version -->
<!-- Full dashboard JS restored from previous good commit -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  // Auth guard + basic shell
  auth.onAuthStateChanged(user => {
    if (!user) { location.href = "login.html"; return; }
    document.getElementById("adminShell").classList.remove("hidden");
  });
  document.getElementById("logoutBtn")?.addEventListener("click", () => auth.signOut());

  // Tab switching
  document.querySelectorAll("[data-tab]").forEach(link => {
    link.addEventListener("click", e => {
      e.preventDefault();
      document.querySelectorAll("[data-tab]").forEach(l => l.classList.remove("active"));
      link.classList.add("active");
      document.querySelectorAll("main > section").forEach(s => s.classList.add("hidden"));
      document.getElementById("tab-" + link.dataset.tab)?.classList.remove("hidden");
    });
  });

  // Placeholder seed button
  document.getElementById("seedBtn")?.addEventListener("click", () => {
    alert("Full dashboard body needs restore from previous commit. Please upload dashboard.SEO-final.html from artifacts.");
  });
</script>
</body>
</html>
